[project]
name = "gestione-donatori"
version = "0.1.0"
description = ""
authors = [{ name = "Denny Biasiolli", email = "dennybiasiolli@users.noreply.github.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "django-reversion>=6.3.0,<7",
    "django>=6.0.8,<7",
    "openpyxl>=3.1.5,<4",
    "psycopg>=3.3.4,<4",
    "python-dotenv>=1.1.1,<2",
]

[dependency-groups]
deploy = [
    "gunicorn>=26.0.0,<27",
    "uvicorn>=0.52.1,<0.53",
    "uvicorn-worker>=0.3.0",
]
dev = [
    "pytest-django>=4.14.0,<5",
    "pytest-cov>=6.2.1,<8",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
extend-select = [
    "DJ", # flake8-django: Django-specific bugs
]
ignore = ["RUF012"]

[tool.uv]
package = false
default-groups = [
    "deploy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "website.settings"
addopts = "-x --cov"
